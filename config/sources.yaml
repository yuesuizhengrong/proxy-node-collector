settings:
  source_timeout_seconds: 40
  source_concurrency: 3
  source_retry_count: 1
  test_timeout_seconds: 8
  controller_start_timeout_seconds: 12
  mihomo_batch_size: 30
  max_candidates_per_source: 3000
  max_tested_nodes: 500
  probe_concurrency: 20
  page_link_limit: 4
  page_payload_limit: 8
  user_agent: "proxy-node-collector/0.2"
  test_url: "https://www.gstatic.com/generate_204"

sources:
  - name: "v2ray-aggregator-uri"
    url: "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt"
    format: "uri"
    enabled: true

  - name: "v2ray-aggregator-base64"
    url: "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge_base64.txt"
    format: "base64"
    enabled: true

  - name: "v2ray-aggregator-clash"
    url: "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge_yaml.yml"
    format: "clash"
    enabled: true

  - name: "awesome-vpn-base64"
    url: "https://raw.githubusercontent.com/awesome-vpn/awesome-vpn/master/all"
    format: "base64"
    enabled: true

  - name: "awesome-vpn-clash"
    url: "https://raw.githubusercontent.com/awesome-vpn/awesome-vpn/master/clash.yaml"
    format: "clash"
    enabled: true

  - name: "vless-reality-uri"
    url: "https://raw.githubusercontent.com/vless-reality/vless-reality.github.io/main/.github/links/v2.txt"
    format: "uri"
    enabled: true

  - name: "vless-reality-clash"
    url: "https://raw.githubusercontent.com/vless-reality/vless-reality.github.io/main/.github/links/clash.yaml"
    format: "clash"
    enabled: true

  # Non-GitHub public websites. These endpoints are parsed and tested like every other source.
  - name: "clashnodefree-clash"
    url: "https://clashnodefree.com/sub/clash.yml"
    format: "clash"
    enabled: true

  - name: "clashnodefree-v2ray"
    url: "https://clashnodefree.com/sub/v2ray.txt"
    format: "base64"
    enabled: true

  - name: "clashnodefree-shadowrocket"
    url: "https://clashnodefree.com/sub/shadowrocket.txt"
    format: "base64"
    enabled: true

  - name: "clashnodefree-ssr"
    url: "https://clashnodefree.com/sub/ssr.txt"
    format: "base64"
    enabled: true

  - name: "xrayvip-base64"
    url: "https://www.xrayvip.com/free.txt"
    format: "base64"
    enabled: true

  - name: "free-datiya-web"
    url: "https://free.datiya.com/"
    format: "page"
    enabled: true
