name: Update proxy nodes

on:
  schedule:
    # Runs every day at 03:15 UTC.
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Collect and test proxies
        run: python -m proxy_node_collector --config config/sources.yaml --out-dir data

      - name: Commit updated proxy data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/proxies.txt data/proxies.json data/summary.md
          if git diff --cached --quiet; then
            echo "No proxy changes to commit."
          else
            git commit -m "chore: update tested proxy nodes"
            git push
          fi

